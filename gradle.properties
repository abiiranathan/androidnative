# ---------------------------------------------------------------------------
# Single source of truth for Android SDK / NDK / CMake versions.
# env.sh reads these values, so bootstrap, Gradle and build.sh stay in sync.
# Override an individual value with the matching environment variable if needed
# (API_LEVEL, TARGET_API, MIN_API, BUILD_TOOLS_VERSION, NDK_VERSION,
# CMAKE_VERSION).
# ---------------------------------------------------------------------------
android.compileSdk=34
android.targetSdk=34
android.minSdk=24
android.buildToolsVersion=34.0.0
android.ndkVersion=27.0.12077973
android.cmakeVersion=3.22.1
android.abis=arm64-v8a,x86_64
android.applicationId=com.example.nativeapp
android.versionCode=1
android.versionName=1.0

# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true

# ---------------------------------------------------------------------------
# AndroidX / resource optimisation
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
