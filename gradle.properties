# ---------------------------------------------------------------------------
# Single source of truth for Android SDK / NDK / CMake versions.
# env.sh reads these values, so bootstrap, Gradle and build.sh stay in sync.
# Override an individual value with the matching environment variable if needed
# (API_LEVEL, TARGET_API, MIN_API, BUILD_TOOLS_VERSION, NDK_VERSION,
# CMAKE_VERSION).
#
# env.sh and the docs-drift check (scripts/check-docs.sh) parse these as plain
# integers/strings, so keep one `key=value` per line and no inline comments.
#
# targetSdk 36: Google Play requires new apps and updates to target API 36
# from August 31, 2026. Raising it changes runtime behaviour (large-screen
# resizability, predictive back, edge-to-edge), so test on a device.
# compileSdk 36: keep it at 36 until you deliberately move to 36.1. Newer
# androidx releases (core 1.18+) require compileSdk 36.1, which needs the
# `platforms;android-36.1` package and AGP's minor-API compileSdk syntax,
# neither of which env.sh/bootstrap.sh understand yet. See the note in
# gradle/libs.versions.toml before bumping any androidx dependency.
# ---------------------------------------------------------------------------
android.compileSdk=36
android.targetSdk=36
android.minSdk=24
android.buildToolsVersion=36.0.0
android.ndkVersion=27.0.12077973
android.cmakeVersion=3.22.1
android.abis=arm64-v8a,x86_64
android.applicationId=com.example.nativeapp
android.versionCode=1
android.versionName=1.0

# ---------------------------------------------------------------------------
# Gradle
# ---------------------------------------------------------------------------
# AGP + Kotlin + Compose need more than the 2 GB default-ish heap on a clean
# build. The Kotlin daemon is a separate JVM; capping it explicitly stops it
# from inheriting the Gradle heap, so peak usage is roughly 3 GB + 2 GB.
# Lower both on machines with 4 GB of RAM or less.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configuration-cache=true

# ---------------------------------------------------------------------------
# AndroidX / resource optimisation
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
